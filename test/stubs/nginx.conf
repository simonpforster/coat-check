server {
    listen 80;
    default_type application/json;

    # Open-Meteo forecast/observation API
    location /v1/forecast {
        return 200 '{
            "latitude": 51.5,
            "longitude": -0.13,
            "timezone": "Europe/London",
            "daily": {
                "time": ["2026-10-05"],
                "temperature_2m_max": [8.2],
                "temperature_2m_min": [3.1],
                "apparent_temperature_min": [0.5],
                "precipitation_sum": [1.2],
                "wind_speed_10m_max": [22.0],
                "snowfall_sum": [0.0],
                "weather_code": [61]
            }
        }';
    }

    # Open-Meteo geocoding API
    location /v1/search {
        return 200 '{
            "results": [
                {
                    "id": 2643743,
                    "name": "London",
                    "latitude": 51.5074,
                    "longitude": -0.1278,
                    "country": "United Kingdom",
                    "admin1": "England"
                }
            ]
        }';
    }
}
