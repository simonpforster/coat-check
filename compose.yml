services:
  api:
    build:
      context: .
      dockerfile: crates/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info

  web:
    build:
      context: .
      dockerfile: crates/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8080
      - BASE_URL=${BASE_URL:-}
      - RUST_LOG=info
    depends_on:
      - api
