name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  pr-title:
    name: PR Title (Conventional Commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  test:
    name: Test & Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Tests with coverage
        run: |
          cargo llvm-cov --json --output-path coverage.json
          cargo llvm-cov report
          COVERAGE=$(jq '.data[0].totals.lines.percent' coverage.json | xargs printf '%.1f')
          echo "::notice::Code coverage: ${COVERAGE}%"

  integration:
    name: Integration Test
    needs: [clippy, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Start stack
        run: docker compose -f compose.yaml -f compose.test.yaml up -d --build --wait --wait-timeout 120

      - name: Health checks
        run: |
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:3000/health

      - name: Web homepage
        run: curl -sf http://localhost:3000/ | grep -q 'Coat Check'

      - name: Web coat check (web → API → stub → Postgres)
        run: |
          BODY=$(curl -sf --retry 3 --retry-delay 2 -X POST http://localhost:3000/check \
            --data-urlencode 'locations=[{"lat":"51.5074","lon":"-0.1278","label":"London"}]')
          echo "$BODY" | grep -qE 'coat|No coat needed'

          # Extract prediction_id from hidden input: name="prediction_id" value="<uuid>"
          PREDICTION_ID=$(echo "$BODY" | grep -oP 'name="prediction_id"\s+value="\K[0-9a-f-]{36}' | head -1)
          echo "PREDICTION_ID=$PREDICTION_ID" >> "$GITHUB_ENV"

      - name: Register email (web → API)
        run: |
          curl -sf -X POST http://localhost:3000/email \
            --data-urlencode "prediction_id=$PREDICTION_ID" \
            --data-urlencode "email=test@example.com" \
            | grep -qi 'success\|thank\|registered'

      - name: Feedback page loads (web → API)
        run: |
          curl -sf "http://localhost:3000/feedback?token=$PREDICTION_ID" \
            | grep -qi 'feedback\|brought'

      - name: Submit feedback (web → API → Postgres)
        run: |
          curl -sf -X POST http://localhost:3000/feedback \
            --data-urlencode "token=$PREDICTION_ID" \
            --data-urlencode "brought=coat" \
            --data-urlencode "should_have_brought=coat" \
            --data-urlencode "comment=spot on" \
            | grep -qi 'thank'

      - name: Notification worker processes queued email
        run: |
          # Create a second prediction via API and register a contact.
          # FEEDBACK_DELAY_MINUTES=0 so the notification is immediately ready.
          RESPONSE=$(curl -sf -X POST http://localhost:8080/coat-check \
            -H 'Content-Type: application/json' \
            -d '{"locations":[{"lat":51.5074,"lon":-0.1278,"label":"London"}]}')
          PID2=$(echo "$RESPONSE" | jq -re '.prediction_id')

          curl -sf -X POST http://localhost:3000/email \
            --data-urlencode "prediction_id=$PID2" \
            --data-urlencode "email=worker-test@example.com"

          # Worker polls every 60s — wait up to 90s for it to fire.
          for i in $(seq 1 18); do
            if docker compose -f compose.yaml -f compose.test.yaml logs api 2>&1 | grep -q "feedback notification sent"; then
              echo "Notification worker processed the queued email"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for notification worker"
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.test.yaml logs
