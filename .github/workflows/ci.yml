name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  pr-title:
    name: PR Title (Conventional Commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  test:
    name: Test & Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Tests with coverage
        run: |
          cargo llvm-cov --json --output-path coverage.json
          cargo llvm-cov report
          COVERAGE=$(jq '.data[0].totals.lines.percent' coverage.json | xargs printf '%.1f')
          echo "::notice::Code coverage: ${COVERAGE}%"

  smoke:
    name: Smoke Test
    needs: [clippy, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p coat-check -p coat-check-web
      - name: Smoke test API
        run: |
          PORT=8080 ./target/release/coat-check &
          API_PID=$!

          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done

          # Real coat-check request against live Open-Meteo (retry up to 3 times)
          RESPONSE=$(curl -sf --retry 3 --retry-delay 2 -X POST http://localhost:8080/coat-check \
            -H 'Content-Type: application/json' \
            -d '{"locations":[{"lat":51.5074,"lon":-0.1278,"label":"London"}]}')

          echo "$RESPONSE" | jq .
          echo "$RESPONSE" | jq -e '.recommendation' > /dev/null
          echo "$RESPONSE" | jq -e '.prediction_id' > /dev/null
          echo "$RESPONSE" | jq -e '.locations | length > 0' > /dev/null

          kill $API_PID

      - name: Smoke test Web
        run: |
          PORT=8080 ./target/release/coat-check &
          API_PID=$!

          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done

          API_URL=http://localhost:8080 PORT=3000 ./target/release/coat-check-web &
          WEB_PID=$!

          for i in $(seq 1 10); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done

          curl -sf http://localhost:3000/ | grep -q 'Coat Check'

          BODY=$(curl -sf --retry 3 --retry-delay 2 -X POST http://localhost:3000/check \
            --data-urlencode 'locations=[{"lat":"51.5074","lon":"-0.1278","label":"London"}]')
          echo "$BODY" | grep -qE 'coat|No coat needed'

          kill $WEB_PID $API_PID

  docker-api:
    name: Docker Build (API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/api/Dockerfile
          push: false

  docker-web:
    name: Docker Build (Web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/web/Dockerfile
          push: false
