name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release Please
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      api_release_created: ${{ steps.release.outputs['crates/api--release_created'] }}
      api_version: ${{ steps.release.outputs['crates/api--version'] }}
      web_release_created: ${{ steps.release.outputs['crates/web--release_created'] }}
      web_version: ${{ steps.release.outputs['crates/web--version'] }}
      backoffice_release_created: ${{ steps.release.outputs['crates/backoffice--release_created'] }}
      backoffice_version: ${{ steps.release.outputs['crates/backoffice--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker-api:
    name: Push API Image
    needs: release
    if: needs.release.outputs.api_release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/api/Dockerfile
          push: true
          tags: |
            ghcr.io/simonpforster/coat-check-api:${{ needs.release.outputs.api_version }}
            ghcr.io/simonpforster/coat-check-api:latest

  docker-web:
    name: Push Web Image
    needs: release
    if: needs.release.outputs.web_release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/web/Dockerfile
          push: true
          tags: |
            ghcr.io/simonpforster/coat-check-web:${{ needs.release.outputs.web_version }}
            ghcr.io/simonpforster/coat-check-web:latest

  docker-backoffice:
    name: Push Backoffice Image
    needs: release
    if: needs.release.outputs.backoffice_release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/backoffice/Dockerfile
          push: true
          tags: |
            ghcr.io/simonpforster/coat-check-backoffice:${{ needs.release.outputs.backoffice_version }}
            ghcr.io/simonpforster/coat-check-backoffice:latest
