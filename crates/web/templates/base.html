<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coat Check — Do I need a coat, jacket, or umbrella today?</title>
  <meta name="description" content="Should I bring a coat, jacket, umbrella, or rain jacket today? Search any city for a weather-based recommendation — find out in seconds whether you need a coat, jacket, or umbrella before you leave.">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
  <meta property="og:title" content="Coat Check — Do I need a coat, jacket, or umbrella today?">
  <meta property="og:description" content="Should I bring a coat, jacket, umbrella, or rain jacket today? Search any city for a quick weather-based recommendation.">
  <meta property="og:type" content="website">
  {% if let Some(url) = base_url %}
  <meta property="og:url" content="{{ url }}">
  <link rel="canonical" href="{{ url }}">
  {% endif %}
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Coat Check — Do I need a coat, jacket, or umbrella today?">
  <meta name="twitter:description" content="Should I bring a coat, jacket, umbrella, or rain jacket today? Search any city for a quick weather-based recommendation.">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;color:#1a1a1a;background:#fafaf9}
    h1{font-size:1.5rem;margin-bottom:0.25rem}
    header p{color:#555;margin-bottom:1rem}
    .form-group{margin-bottom:0.75rem}
    label{display:block;font-size:0.85rem;font-weight:600;margin-bottom:0.25rem}
    input{width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:4px;font-size:1rem}
    button{padding:0.6rem 1.2rem;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:1rem}
    button:hover{background:#1d4ed8}
    button:disabled{opacity:0.5;cursor:not-allowed}
    .search-wrap{position:relative}
    #suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;border-top:none;border-radius:0 0 4px 4px;z-index:10;display:none}
    #suggestions:not(:empty){display:block}
    .suggestion{display:block;width:100%;text-align:left;padding:0.5rem;background:none;color:#1a1a1a;border:none;border-bottom:1px solid #eee;cursor:pointer;font-size:0.9rem}
    .suggestion:hover{background:#f0f0f0}
    .selected-locations{margin:0.75rem 0;display:flex;flex-direction:column;gap:0.35rem}
    .selected-location{display:flex;align-items:center;justify-content:space-between;font-size:0.85rem;padding:0.4rem 0.6rem;background:#f0f4ff;border:1px solid #bfdbfe;border-radius:4px}
    .selected-location .remove{background:none;border:none;color:#991b1b;cursor:pointer;font-size:1rem;padding:0 0.3rem;line-height:1}
    .selected-location .remove:hover{color:#ef4444}
    .result{margin-top:1.5rem;padding:1rem;border-radius:6px;background:#f0fdf4;border:1px solid #bbf7d0}
    .result.coat{background:#fef2f2;border-color:#fecaca}
    .result.rain_jacket{background:#eff6ff;border-color:#bfdbfe}
    .result.umbrella{background:#fefce8;border-color:#fef08a}
    .result h2{font-size:1.2rem;margin-bottom:0.5rem}
    .location-detail{margin-top:0.75rem;padding:0.5rem;background:rgba(255,255,255,0.6);border-radius:4px;font-size:0.9rem}
    .htmx-indicator{display:none}
    .htmx-request .htmx-indicator{display:inline}
    .htmx-request button{opacity:0.6}
    .error{background:#fef2f2;border:1px solid #fecaca;padding:1rem;border-radius:6px;color:#991b1b;margin-top:1.5rem}
  </style>
</head>
<body>
  <header>
    <h1>Coat Check</h1>
    <p>Do I need a coat, jacket, or umbrella today?</p>
  </header>
  <main>
  <form hx-post="/check" hx-target="#result" hx-swap="innerHTML">
    <div class="form-group search-wrap">
      <label for="search">Add locations</label>
      <input type="text" id="search" name="q" placeholder="Search for a city..."
             hx-get="/search" hx-trigger="keyup changed delay:300ms" hx-target="#suggestions"
             autocomplete="off">
      <div id="suggestions"></div>
    </div>
    <div class="selected-locations" id="location-list"></div>
    <input type="hidden" name="locations" id="locations-input" value="[]">
    <button type="submit" id="submit-btn" disabled>Check <span class="htmx-indicator">...</span></button>
  </form>
  <div id="result"></div>
  </main>
  <footer style="margin-top:3rem;padding-top:1.5rem;border-top:1px solid #e5e5e5;font-size:0.8rem;color:#888">
    <p>Your email is only stored until the feedback request is sent, then permanently deleted.</p>
    <details style="margin-top:0.75rem">
      <summary style="cursor:pointer;color:#2563eb">Unsubscribe from pending emails</summary>
      <form hx-post="/unsubscribe" hx-target="#unsub-result" hx-swap="innerHTML" style="margin-top:0.5rem;display:flex;gap:0.5rem;align-items:center">
        <input type="email" name="email" placeholder="your@email.com" required style="padding:0.35rem 0.5rem;border:1px solid #ccc;border-radius:4px;font-size:0.85rem;flex:1">
        <button type="submit" style="padding:0.35rem 0.8rem;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.85rem">Unsubscribe</button>
      </form>
      <div id="unsub-result"></div>
    </details>
  </footer>
  {% if let Some(id) = ga_id %}
  <script>
    function loadGA(){
      if(document.getElementById('ga-script'))return;
      var s=document.createElement('script');s.id='ga-script';s.async=true;
      s.src='https://www.googletagmanager.com/gtag/js?id={{ id }}';
      document.head.appendChild(s);
      window.dataLayer=window.dataLayer||[];
      function gtag(){dataLayer.push(arguments);}
      gtag('js',new Date());gtag('config','{{ id }}');
    }
    function acceptCookies(){localStorage.setItem('cc_consent','1');loadGA();document.getElementById('cookie-banner').remove();}
    function declineCookies(){localStorage.setItem('cc_consent','0');document.getElementById('cookie-banner').remove();}
    if(localStorage.getItem('cc_consent')==='1')loadGA();
    else if(localStorage.getItem('cc_consent')!=='0'){
      document.addEventListener('DOMContentLoaded',function(){
        var b=document.createElement('div');b.id='cookie-banner';
        b.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;color:#fff;padding:1rem;display:flex;align-items:center;justify-content:center;gap:1rem;font-size:0.85rem;z-index:9999';
        b.innerHTML='We use cookies for analytics. <button onclick="acceptCookies()" style="padding:0.3rem 0.8rem;border:none;border-radius:4px;background:#2563eb;color:#fff;cursor:pointer">Accept</button><button onclick="declineCookies()" style="padding:0.3rem 0.8rem;border:1px solid #555;border-radius:4px;background:transparent;color:#fff;cursor:pointer">Decline</button>';
        document.body.appendChild(b);
      });
    }
  </script>
  {% endif %}
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/htmx.min.js" integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc" crossorigin="anonymous"></script>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
  <script>
    var selectedLocations = [];

    function selectLocation(name, lat, lon) {
      selectedLocations.push({lat: lat, lon: lon, label: name});
      updateLocationList();
      document.getElementById('search').value = '';
      document.getElementById('suggestions').innerHTML = '';
    }

    function removeLocation(index) {
      selectedLocations.splice(index, 1);
      updateLocationList();
    }

    function updateLocationList() {
      var list = document.getElementById('location-list');
      var input = document.getElementById('locations-input');
      var btn = document.getElementById('submit-btn');

      input.value = JSON.stringify(selectedLocations);
      btn.disabled = selectedLocations.length === 0;

      list.innerHTML = '';
      selectedLocations.forEach(function(loc, i) {
        var row = document.createElement('div');
        row.className = 'selected-location';
        var span = document.createElement('span');
        span.textContent = loc.label;
        var rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'remove';
        rm.innerHTML = '&times;';
        rm.onclick = function() { removeLocation(i); };
        row.appendChild(span);
        row.appendChild(rm);
        list.appendChild(row);
      });
    }
  </script>
</body>
</html>
