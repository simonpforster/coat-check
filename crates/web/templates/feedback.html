<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coat Check — Feedback</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;color:#1a1a1a;background:#fafaf9}
    h1{font-size:1.5rem;margin-bottom:0.25rem}
    header p{color:#555;margin-bottom:1rem}
    .card{margin-top:1.5rem;padding:1rem;border-radius:6px;background:#f0fdf4;border:1px solid #bbf7d0}
    .card h2{font-size:1.1rem;margin-bottom:0.5rem}
    .card p{margin-bottom:0.75rem;font-size:0.95rem}
    label{display:block;font-size:0.85rem;font-weight:600;margin-top:0.75rem}
    select{width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:4px;font-size:0.9rem;margin-top:0.25rem;background:#fff}
    textarea{width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:4px;font-size:0.9rem;margin-top:0.25rem;resize:vertical}
    button{margin-top:1rem;padding:0.6rem 1.2rem;border:none;border-radius:4px;cursor:pointer;font-size:1rem;background:#16a34a;color:#fff}
    button:hover{background:#15803d}
  </style>
</head>
<body>
  <header>
    <h1>Coat Check</h1>
    <p>How was our prediction?</p>
  </header>
  <main>
    <div class="card">
      <h2>Our prediction: {{ recommendation }}</h2>
      <p>{{ reason }}</p>
    </div>
    <form method="post" action="/feedback">
      <input type="hidden" name="token" value="{{ token }}">

      <label for="brought">What did you bring?</label>
      <select id="brought" name="brought" required>
        <option value="" disabled selected>Select...</option>
        {% for (value, label) in options %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>

      <label for="should_have_brought">What should you have brought?</label>
      <select id="should_have_brought" name="should_have_brought" required>
        <option value="" disabled selected>Select...</option>
        {% for (value, label) in options %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>

      <label for="comment">Any comments? (optional)</label>
      <textarea id="comment" name="comment" rows="3" placeholder="Tell us more..."></textarea>

      <button type="submit">Submit feedback</button>
    </form>
  </main>
</body>
</html>
