<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coat Check — Feedback</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;color:#1a1a1a;background:#fafaf9}
    h1{font-size:1.5rem;margin-bottom:0.25rem}
    header p{color:#555;margin-bottom:1rem}
    .card{margin-top:1.5rem;padding:1.5rem;border-radius:6px;background:#fff;border:1px solid #e5e5e5;text-align:center}
    .card h2{font-size:1.2rem;margin-bottom:0.75rem}
    .card p{color:#555;font-size:0.95rem;line-height:1.6;margin-bottom:0.5rem}
    a{color:#2563eb;text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <header>
    <h1>Coat Check</h1>
    <p>Feedback</p>
  </header>
  <main>
    <div class="card">
      <h2>This feedback link is no longer active</h2>
      <p>You may have already submitted feedback for this prediction, or the link has expired.</p>
      <p>Thanks for using Coat Check! <a href="/">Check today's forecast &rarr;</a></p>
    </div>
  </main>
</body>
</html>
