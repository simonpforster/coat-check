[package]
name = "coat-check-backoffice"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "coat-check-backoffice"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "json"] }
askama = "0.14"
askama_web = { version = "0.14", features = ["axum-0.8"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
coat-check-common = { path = "../common" }
async-trait = "0.1"
thiserror = "2"
serde_json = "1"
